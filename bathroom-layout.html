<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Top-down bathroom map with stalls and sinks." />
    <title>Bathroom map</title>
    <link rel="stylesheet" href="bathroom-layout.css" />
  </head>
  <body>
    <main class="bathroom-map" aria-label="Bathroom map">
      <section class="bathroom" aria-label="Top-down bathroom with stalls and sinks">
        <div class="stalls" aria-label="Six bathroom stalls">
          <section class="stall"><div class="stall-door">Stall door</div></section>
          <section class="stall"><div class="stall-door">Stall door</div></section>
          <section class="stall"><div class="stall-door">Stall door</div></section>
          <section class="stall"><div class="stall-door">Stall door</div></section>
          <section class="stall"><div class="stall-door">Stall door</div></section>
          <section class="stall"><div class="stall-door">Stall door</div></section>
        </div>

        <div class="sinks" aria-label="Three sinks">
          <div class="sink">Sink</div>
          <div class="sink">Sink</div>
          <div class="sink">Sink</div>
        </div>

        <div class="main-door" role="img" aria-label="Bathroom entrance door">Door</div>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A friendly interactive Hello World web app." />
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">YOUR FIRST WEB APP</p>
      <div class="orb" aria-hidden="true"><span>✦</span></div>
      <h1 id="greeting">Hello, World!</h1>
      <p class="subtitle">A small beginning with plenty of room to grow.</p>
      <button id="greet-button" type="button">Say hello back <span aria-hidden="true">→</span></button>
      <p id="message" class="message" aria-live="polite"></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>

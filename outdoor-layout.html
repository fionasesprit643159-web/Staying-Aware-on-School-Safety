<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Outdoor event layout with trees, tables, and gates." />
    <title>Quad map</title>
    <link rel="stylesheet" href="outdoor-layout.css" />
  </head>
  <body>
    <div class="quad-timer" role="timer" aria-label="Countdown timer">
      <span class="quad-timer-value" id="timer-value">--:--</span>
    </div>
    <div class="map-controls" role="group" aria-label="Map zoom controls">
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <output id="zoom-level" aria-live="polite">100%</output>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="reset-view">Reset</button>
    </div>
    <div class="map-viewport" id="map-viewport" role="region" aria-label="Quad map. Drag the map to pan when zoomed in.">
      <main class="site-plan" aria-label="Outdoor site layout">
      <section class="grounds" aria-label="Enclosed outdoor area">
        <div class="tree tree-top-left" role="img" aria-label="Tree canopy"><span>Tree</span></div>
        <div class="tree tree-bottom-left" role="img" aria-label="Tree canopy"><span>Tree</span></div>
        <div class="tree tree-top-right" role="img" aria-label="Tree canopy"><span>Tree</span></div>
        <div class="tree tree-bottom-right" role="img" aria-label="Tree canopy"><span>Tree</span></div>

        <div class="tables" aria-label="Eight tables">
          <div class="table">Table</div><div class="table">Table</div>
          <div class="table">Table</div><div class="table">Table</div>
          <div class="table">Table</div><div class="table">Table</div>
          <div class="table">Table</div><div class="table">Table</div>
        </div>
      </section>

      <button class="gate gate-left" type="button" aria-label="Left gate" aria-expanded="false">Gate</button>
      <button class="gate gate-right" type="button" aria-label="Right gate" aria-expanded="false">Gate</button>
      </main>
    </div>
    <script src="quad-timer.js"></script>
    <script src="quad-map.js"></script>
  </body>
</html>

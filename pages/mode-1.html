<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode 1</title>
    <link rel="stylesheet" href="../styles/mode-1.css">
</head>
<body>
    <h1>School Map</h1>

    <div class="mapBox">
        <img src="../assets/images/map2import.png" alt="Image of a fictional school map from bird's-eye view" class="game-map" width="600" height="400">
        <button class="building-button building-a" id="BuildA">Class A</button>
        <button class="building-button building-b" id="BuildB">Class B</button>
        <button class="building-button building-c" id="BuildC">Quad B</button>
        <button class="building-button building-d" id="BuildD">Quad A</button>
        <button class="building-button building-e" id="BuildE">Bathroom</button>
        <button class="building-button building-f" id="BuildF">Class F</button>
        <button class="building-button building-g" id="BuildG">Class G</button>
    </div>

    <script src="../scripts/mode-1.js"></script>
